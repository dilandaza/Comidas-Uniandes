<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>almorza2 - Presupuesto y Foro Estudiantil</title>
    <link rel="icon" type="image/png" href="almorza2-olla.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Paleta cálida: "emerald" pasa a ser naranja terracota y "slate" a beige/café
        tailwind.config = {
            darkMode: ['variant', '&:where(.dark-mode, .dark-mode *)'],
            theme: { extend: { colors: {
                emerald: { 50:'#fdf3e7',100:'#fbe5cc',200:'#f6cb9f',300:'#efab6d',400:'#e78d45',500:'#d9763a',600:'#c8642b',700:'#a94f21',800:'#86401d',900:'#6b351c',950:'#3a1b0c' },
                slate:   { 50:'#faf5ec',100:'#f3eadb',200:'#eadfca',300:'#d8c9ae',400:'#b5a38c',500:'#8a7766',600:'#6b5a4b',700:'#50443a',800:'#3a3029',900:'#2a2119',950:'#1f1812' }
            } } }
        }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #f6efe4;
            --sidebar-bg: #fcf8f1;
            --text-main: #3b2f26;
            --text-muted: #8a7766;
            --border-color: #e8dcc8;
            --card-bg: #fcf8f1;
            --shadow: 0 6px 20px rgba(140, 95, 50, .09);
        }
        body.dark-mode {
            --bg-color: #1f1812;
            --sidebar-bg: #2a2119;
            --text-main: #f5ebdc;
            --text-muted: #b5a38c;
            --border-color: #473a2d;
            --card-bg: #2a2119;
            --shadow: 0 6px 20px rgba(0, 0, 0, .25);
        }
        html, body { overflow-x: hidden; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Nunito', sans-serif; }
        h1, h2, .font-display { font-family: 'Fraunces', Georgia, serif; letter-spacing: -0.01em; }
        input, textarea, select { background-color: var(--card-bg); color: var(--text-main); border-color: var(--border-color); }
        input::placeholder, textarea::placeholder { color: var(--text-muted); opacity: .8; }
        .card, .budget-box { box-shadow: var(--shadow); }
        button { transition: background-color .2s, transform .15s; }
        button:active { transform: scale(.97); }
        #map { height: 300px; width: 100%; border-radius: 1.5rem; z-index: 1; }
        .leaflet-tile-pane { filter: sepia(.35) saturate(.85) brightness(1.02); }
        .leaflet-marker-pane img { filter: hue-rotate(165deg) saturate(1.3); }
        body.dark-mode .leaflet-tile-pane { filter: invert(.9) hue-rotate(180deg) sepia(.4) brightness(.9); }

        /* ---- AJUSTES PARA CELULAR ---- */
        #sidebar { transition: width .3s ease; }
        #sidebar.colapsada { width: 0; border-right-width: 0; }
        #sidebar.colapsada #btn-toggle-sidebar { right: -1.5rem; border-top-left-radius: 0; border-bottom-left-radius: 0; }
        .filtros { scrollbar-width: none; }
        .filtros::-webkit-scrollbar { display: none; }
        @media (max-width: 767px) {
            #map { height: 230px; border-radius: 1.25rem; }
            /* 16px evita el zoom automático de iOS al tocar un campo */
            input, textarea, select { font-size: 16px !important; }
        }
    </style>
</head>
<body class="flex h-[100dvh] overflow-hidden">

    <!-- BARRA LATERAL (en celular pasa a barra inferior) -->
    <aside id="sidebar" class="relative shrink-0 w-20 bg-[var(--sidebar-bg)] border-r border-[var(--border-color)] z-20">
        <div class="absolute inset-0 overflow-hidden">
            <div class="w-20 h-full flex flex-col items-center py-6 justify-between">
                <div class="flex flex-col items-center gap-6">
                    <img src="almorza2-olla.png" alt="almorza2" class="w-12 h-12 object-contain">
                    <div onclick="cambiarVista('inicio')" class="w-12 h-12 rounded-full flex items-center justify-center cursor-pointer text-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Restaurantes y Mapa">🍽️</div>
                    <div onclick="cambiarVista('foro')" class="w-12 h-12 rounded-full flex items-center justify-center cursor-pointer text-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Foro Comunitario">💬</div>
                </div>
                <div class="w-12 h-12 rounded-full flex items-center justify-center cursor-pointer text-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition" id="btn-config" title="Modo Oscuro">⚙️</div>
            </div>
        </div>
        <button id="btn-toggle-sidebar" onclick="alternarSidebar()" aria-label="Mostrar u ocultar menú" class="absolute top-1/2 -translate-y-1/2 -right-3 w-6 h-12 rounded-full bg-emerald-600 text-white text-sm font-bold flex items-center justify-center shadow-md">‹</button>
    </aside>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="flex-1 min-w-0 flex flex-col h-full overflow-y-auto">
        <header class="bg-[var(--sidebar-bg)] border-b border-[var(--border-color)] px-4 md:px-8 py-3 md:py-4 flex flex-col md:flex-row gap-3 md:gap-4 md:justify-between md:items-center">
            <div class="flex items-center gap-3 md:gap-4 min-w-0">
                <img src="almorza2-logotipo.png" alt="almorza2" class="h-9 md:h-11 w-auto shrink-0">
                <div class="border-l border-[var(--border-color)] pl-3 md:pl-4 min-w-0">
                    <h1 class="text-base md:text-lg font-bold leading-tight" id="titulo-seccion">Alimentación Inteligente</h1>
                    <p class="text-[11px] md:text-xs text-[var(--text-muted)]" id="subtitulo-seccion">Encuentra opciones económicas cerca a UniAndes</p>
                </div>
            </div>
            <div class="flex items-center justify-between md:justify-start gap-4 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 pl-5 pr-3 py-2 rounded-full">
                <div>
                    <p class="text-[10px] text-emerald-700 dark:text-emerald-300 font-bold uppercase tracking-wide">Presupuesto disponible</p>
                    <p class="font-display text-lg font-bold text-emerald-800 dark:text-emerald-200" id="lbl-saldo-actual">$500.000 COP</p>
                </div>
                <button onclick="ajustarPresupuesto()" class="bg-emerald-200 hover:bg-emerald-300 dark:bg-emerald-800 dark:hover:bg-emerald-700 text-emerald-900 dark:text-emerald-100 text-xs px-4 py-2 rounded-full font-bold">Ajustar</button>
            </div>
        </header>

        <!-- VISTA 1: INICIO -->
        <div id="vista-inicio" class="p-4 md:p-8 max-w-7xl mx-auto w-full flex flex-col gap-4 md:gap-6">
            <div class="budget-box bg-[var(--sidebar-bg)] border border-[var(--border-color)] p-3 md:p-4 rounded-3xl">
                <h2 class="text-base font-bold mb-3 px-1">Mapa · Zona UniAndes</h2>
                <div id="map"></div>
            </div>

            <div class="budget-box bg-[var(--sidebar-bg)] border border-[var(--border-color)] p-2 md:p-4 rounded-full flex gap-2 md:gap-3 items-center">
                <input type="text" id="input-busqueda" placeholder="Buscar por plato o restaurante..." class="flex-1 min-w-0 px-4 md:px-5 py-2.5 text-sm rounded-full border focus:outline-none focus:ring-2 focus:ring-emerald-300">
                <button onclick="cargarRestaurantes()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 md:px-6 py-2.5 rounded-full text-sm font-bold shrink-0">Buscar</button>
            </div>

            <div class="filtros flex gap-2 overflow-x-auto pb-1 md:mb-2 -mx-4 px-4 md:mx-0 md:px-0">
                <button onclick="filtrarRestaurantes('todos')" id="btn-filtro-todos" class="bg-emerald-600 text-white text-xs px-5 py-2.5 rounded-full font-bold whitespace-nowrap">Todos</button>
                <button onclick="filtrarRestaurantes('menor_15')" id="btn-filtro-menor_15" class="bg-slate-200 dark:bg-slate-800 text-[var(--text-main)] text-xs px-5 py-2.5 rounded-full font-bold whitespace-nowrap">Menor de $15.000 · Económico</button>
                <button onclick="filtrarRestaurantes('mayor_15')" id="btn-filtro-mayor_15" class="bg-slate-200 dark:bg-slate-800 text-[var(--text-main)] text-xs px-5 py-2.5 rounded-full font-bold whitespace-nowrap">Mayor de $15.000 · Especial</button>
            </div>

            <div>
                <div class="flex justify-between items-center mb-3 md:mb-4 gap-2">
                    <h2 class="text-lg md:text-xl font-bold">Restaurantes disponibles</h2>
                    <span class="text-xs text-[var(--text-muted)] whitespace-nowrap" id="contador-resultados">Cargando...</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6" id="contenedor-restaurantes"></div>
            </div>
        </div>

        <!-- VISTA 2: FORO -->
        <div id="vista-foro" class="p-4 md:p-8 max-w-4xl mx-auto w-full hidden flex-col gap-4 md:gap-6">
            <div class="budget-box bg-[var(--sidebar-bg)] border border-[var(--border-color)] p-4 md:p-6 rounded-3xl">
                <h2 class="text-lg font-bold mb-1">Comparte un tip o reseña</h2>
                <p class="text-xs text-[var(--text-muted)] mb-4">Ayuda a otros uniandinos a encontrar las mejores opciones y cuidar el bolsillo.</p>

                <form onsubmit="publicarComentario(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold mb-1 ml-2">Tu nombre o apodo</label>
                            <input type="text" id="foro-nombre" required placeholder="Ej. Ana (Microbiología)" class="w-full px-5 py-2.5 text-sm rounded-full border focus:outline-none focus:ring-2 focus:ring-emerald-300">
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1 ml-2">Restaurante o zona</label>
                            <input type="text" id="foro-lugar" required placeholder="Ej. La Nena / Cafetería Central" class="w-full px-5 py-2.5 text-sm rounded-full border focus:outline-none focus:ring-2 focus:ring-emerald-300">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1 ml-2">Tu opinión o tip</label>
                        <textarea id="foro-texto" required rows="3" placeholder="Ej. El menú ejecutivo de pollo es gigante y baratísimo, pero vayan antes de las 12:30 porque se llena." class="w-full px-5 py-3 text-sm rounded-3xl border focus:outline-none focus:ring-2 focus:ring-emerald-300"></textarea>
                    </div>
                    <button type="submit" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-6 py-3 md:py-2.5 rounded-full font-bold">Publicar en el foro</button>
                </form>
            </div>

            <div class="space-y-4" id="contenedor-foro"></div>
        </div>
    </main>

    <!-- MODAL DE DETALLE -->
    <div id="modal-restaurante" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-3 md:p-4">
        <div class="bg-[var(--card-bg)] text-[var(--text-main)] rounded-[1.75rem] md:rounded-[2rem] max-w-lg w-full p-4 md:p-6 shadow-2xl relative border border-[var(--border-color)] max-h-[92dvh] overflow-y-auto">
            <button onclick="cerrarModal()" class="absolute top-3 right-3 md:top-4 md:right-4 w-9 h-9 md:w-8 md:h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-[var(--text-muted)] hover:bg-slate-200 dark:hover:bg-slate-700 text-sm font-bold z-10">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // CAMBIA ESTA URL POR LA DE TU BACKEND REAL EN RENDER
        const API_URL = "https://observatorio-obras-bogota.onrender.com";

        function esc(t) {
            return String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
        }

        const map = L.map('map').setView([4.6017, -74.0662], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marcadoresLayer = L.layerGroup().addTo(map);
        let listaGlobal = [];

        // Datos de respaldo para que la app nunca quede en blanco si Render está despertando
        const datosRespaldo = [
            {
                nombre: "La Nena Restaurante", direccion: "Calle 19A # 1-28, Bogotá",
                calificacion: 4.6, total_reviews: 128, id_lugar: "rest_1", abierto: true,
                lat: 4.6025, lng: -74.0665,
                foto: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80",
                nivel_precio: "$$", es_ejemplo: true,
                platos: [
                    { nombre: "Menú Ejecutivo del Día", precio: 12000, descripcion: "Sopa, plato principal con carne o pollo, arroz, ensalada y jugo." },
                    { nombre: "Parrillada Especial de la Casa", precio: 24000, descripcion: "Corte de res a la parrilla, chorizo, papa criolla, arepa y chimichurri." }
                ],
                resenas: [{ usuario: "Sofía G. (Derecho)", estrellas: 5, comentario: "¡Excelente porción y súper económico!" }]
            },
            {
                nombre: "Wok & Bowl UniAndes", direccion: "Cra. 1 #18A-12, Bogotá",
                calificacion: 4.8, total_reviews: 95, id_lugar: "rest_2", abierto: true,
                lat: 4.6020, lng: -74.0660,
                foto: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=600&q=80",
                nivel_precio: "$$", es_ejemplo: true,
                platos: [
                    { nombre: "Bowl Universitario", precio: 15000, descripcion: "Base de arroz o quinua, proteína a elección y aguacate." },
                    { nombre: "Hamburguesa Artesanal Doble", precio: 22000, descripcion: "Doble carne angus, queso cheddar fundido, tocineta y papas rústicas." }
                ],
                resenas: [{ usuario: "Daniel M. (Ingeniería)", estrellas: 5, comentario: "La hamburguesa vale totalmente la pena cuando hay presupuesto." }]
            },
            {
                nombre: "Trattoria del Campus", direccion: "Calle 19 # 2-30, Bogotá",
                calificacion: 4.7, total_reviews: 80, id_lugar: "rest_3", abierto: true,
                lat: 4.6010, lng: -74.0670,
                foto: "https://images.unsplash.com/photo-1543353071-10c8ba85a904?auto=format&fit=crop&w=600&q=80",
                nivel_precio: "$$", es_ejemplo: true,
                platos: [
                    { nombre: "Pasta Casera Boloñesa", precio: 14000, descripcion: "Porción generosa de pasta con salsa de carne tradicional y queso parmesano." },
                    { nombre: "Lomo de Cerdo en Salsa BBQ", precio: 21000, descripcion: "Jugoso lomo bañado en salsa BBQ artesanal con puré de papa." }
                ],
                resenas: [{ usuario: "Juan K. (Diseño)", estrellas: 5, comentario: "La pasta boloñesa es increíblemente barata y rica." }]
            }
        ];

        // Barra lateral contraíble (en celular arranca contraída)
        function alternarSidebar(forzarCerrar) {
            const sb = document.getElementById('sidebar');
            const cerrar = forzarCerrar === true ? true : !sb.classList.contains('colapsada');
            sb.classList.toggle('colapsada', cerrar);
            document.getElementById('btn-toggle-sidebar').innerText = cerrar ? '›' : '‹';
            setTimeout(() => map.invalidateSize(), 350);
        }
        if (window.innerWidth < 768) alternarSidebar(true);

        function cambiarVista(vista) {
            const vInicio = document.getElementById('vista-inicio');
            const vForo = document.getElementById('vista-foro');
            const tit = document.getElementById('titulo-seccion');
            const sub = document.getElementById('subtitulo-seccion');

            if (vista === 'inicio') {
                vInicio.classList.remove('hidden');
                vInicio.classList.add('flex');
                vForo.classList.remove('flex');
                vForo.classList.add('hidden');
                tit.innerText = "Alimentación Inteligente";
                sub.innerText = "Encuentra opciones económicas cerca a UniAndes";
                setTimeout(() => { map.invalidateSize(); }, 200);
            } else {
                vInicio.classList.remove('flex');
                vInicio.classList.add('hidden');
                vForo.classList.remove('hidden');
                vForo.classList.add('flex');
                tit.innerText = "Foro Comunitario";
                sub.innerText = "Comparte y lee tips de otros estudiantes de la universidad";
                cargarForo();
            }
            document.querySelector('main').scrollTo({ top: 0 });
            if (window.innerWidth < 768) alternarSidebar(true);
        }

        // Modo Oscuro
        const btnConfig = document.getElementById('btn-config');
        if (localStorage.getItem('darkMode') === 'enabled') document.body.classList.add('dark-mode');
        btnConfig.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode') ? 'enabled' : 'disabled');
        });

        document.getElementById('input-busqueda').addEventListener('keydown', e => { if (e.key === 'Enter') cargarRestaurantes(); });

        async function cargarRestaurantes() {
            const query = document.getElementById('input-busqueda').value || "almuerzo";

            listaGlobal = datosRespaldo;
            aplicarFiltroYRenderizar();

            try {
                const response = await fetch(`${API_URL}/api/restaurantes?query=${encodeURIComponent(query)}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.length > 0) {
                        listaGlobal = data;
                        aplicarFiltroYRenderizar();
                    }
                }
            } catch (error) {
                console.log("Usando datos locales por modo offline o demora en servidor.");
            }
        }

        let tipoFiltroActual = 'todos';
        const CLASE_ACTIVO = "bg-emerald-600 text-white text-xs px-5 py-2.5 rounded-full font-bold whitespace-nowrap";
        const CLASE_INACTIVO = "bg-slate-200 dark:bg-slate-800 text-[var(--text-main)] text-xs px-5 py-2.5 rounded-full font-bold whitespace-nowrap";

        function filtrarRestaurantes(tipo) {
            tipoFiltroActual = tipo;
            ['todos', 'menor_15', 'mayor_15'].forEach(id => {
                const btn = document.getElementById(`btn-filtro-${id}`);
                if (btn) btn.className = id === tipo ? CLASE_ACTIVO : CLASE_INACTIVO;
            });
            aplicarFiltroYRenderizar();
        }

        function aplicarFiltroYRenderizar() {
            let listaFiltrada = [...listaGlobal];
            if (tipoFiltroActual === 'menor_15') {
                listaFiltrada = listaFiltrada.filter(r => r.platos && r.platos.some(p => Number(p.precio) <= 15000));
            } else if (tipoFiltroActual === 'mayor_15') {
                listaFiltrada = listaFiltrada.filter(r => r.platos && r.platos.some(p => Number(p.precio) > 15000));
            }
            renderizarApp(listaFiltrada);
        }

        function renderizarApp(lista) {
            const contenedor = document.getElementById('contenedor-restaurantes');
            contenedor.innerHTML = '';
            marcadoresLayer.clearLayers();
            const group = new L.FeatureGroup();

            const uniIcon = L.divIcon({
                className: 'custom-uni-icon',
                html: '<div style="background-color: #c8642b; color: white; padding: 5px 10px; border-radius: 999px; font-weight: 700; font-size: 11px; box-shadow: 0 2px 6px rgba(80,40,10,0.3);">🎓 UniAndes</div>',
                iconSize: [80, 30]
            });
            const uniMarker = L.marker([4.6017, -74.0662], { icon: uniIcon }).bindPopup("<b>Universidad de los Andes</b>");
            marcadoresLayer.addLayer(uniMarker);
            group.addLayer(uniMarker);

            lista.forEach((r, index) => {
                const lat = r.lat || (4.6017 + (Math.sin(index) * 0.002));
                const lng = r.lng || (-74.0662 + (Math.cos(index) * 0.002));
                const fotoUrl = r.foto || "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80";

                const gi = listaGlobal.indexOf(r);
                const marker = L.marker([lat, lng]).bindPopup(() => popupHtml(r, gi), { maxWidth: 260 });
                marcadoresLayer.addLayer(marker);
                group.addLayer(marker);

                contenedor.innerHTML += `
                    <div class="card bg-[var(--sidebar-bg)] border border-[var(--border-color)] rounded-3xl overflow-hidden flex flex-col justify-between transition hover:-translate-y-0.5">
                        <img src="${esc(fotoUrl)}" alt="${esc(r.nombre)}" class="w-full h-40 sm:h-36 object-cover">
                        <div class="p-5 flex flex-col flex-1 justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-1 gap-2">
                                    <h3 class="font-display font-bold text-base line-clamp-1">${esc(r.nombre)}</h3>
                                    <span class="bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 text-[10px] px-2.5 py-1 rounded-full font-bold whitespace-nowrap">⭐ ${esc(r.calificacion)}</span>
                                </div>
                                <p class="text-[11px] text-emerald-700 dark:text-emerald-300 font-semibold mb-1">📍 ${esc(r.direccion)}</p>
                                <p class="text-[11px] text-[var(--text-muted)] mb-4">Precio: ${esc(r.nivel_precio || "N/D")}</p>
                            </div>
                            <button onclick="abrirDetalle(${gi})" class="w-full bg-emerald-100 hover:bg-emerald-200 dark:bg-emerald-800 dark:hover:bg-emerald-700 text-emerald-900 dark:text-emerald-100 text-xs py-3 md:py-2.5 rounded-full font-bold">
                                Ver menú y precios
                            </button>
                        </div>
                    </div>
                `;
            });

            if (group.getLayers().length > 0) map.fitBounds(group.getBounds().pad(0.2));
            document.getElementById('contador-resultados').innerText = `Mostrando ${lista.length} opciones`;
        }

        // FORO ESTUDIANTIL
        function obtenerComentarios() {
            let guardados = localStorage.getItem('bolsillou_foro');
            if (guardados) return JSON.parse(guardados);
            return [
                {
                    nombre: "Camila R. (Ingeniería)", lugar: "La Nena Restaurante",
                    texto: "El almuerzo ejecutivo vale totalmente la pena por $13k. Tip: pidan el jugo en leche si hay disponible.",
                    fecha: "Hace 2 horas"
                },
                {
                    nombre: "Mateo S. (Administración)", lugar: "Cafetería Central UniAndes",
                    texto: "Para los días de parciales donde no hay tiempo de salir del campus, el menú económico de la central salva la vida.",
                    fecha: "Ayer"
                }
            ];
        }

        function cargarForo() {
            const contenedor = document.getElementById('contenedor-foro');
            const comentarios = obtenerComentarios();
            contenedor.innerHTML = '';

            if (comentarios.length === 0) {
                contenedor.innerHTML = `<div class="text-center py-6 text-[var(--text-muted)] text-xs">No hay publicaciones aún. ¡Sé el primero en opinar!</div>`;
                return;
            }

            comentarios.forEach((c) => {
                contenedor.innerHTML += `
                    <div class="budget-box bg-[var(--sidebar-bg)] border border-[var(--border-color)] p-4 md:p-5 rounded-3xl">
                        <div class="flex justify-between items-start gap-3 mb-2">
                            <div class="min-w-0">
                                <h3 class="font-bold text-sm text-[var(--text-main)]">${esc(c.nombre)}</h3>
                                <span class="inline-block bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 text-[10px] px-2.5 py-1 rounded-full font-bold mt-1">📍 ${esc(c.lugar)}</span>
                            </div>
                            <span class="text-[10px] text-[var(--text-muted)] whitespace-nowrap">${esc(c.fecha)}</span>
                        </div>
                        <p class="text-sm text-[var(--text-muted)] mt-2 leading-relaxed break-words">${esc(c.texto)}</p>
                    </div>
                `;
            });
        }

        function publicarComentario(e) {
            e.preventDefault();
            const nombre = document.getElementById('foro-nombre').value;
            const lugar = document.getElementById('foro-lugar').value;
            const texto = document.getElementById('foro-texto').value;

            const nuevoComentario = { nombre, lugar, texto, fecha: "Hace un momento" };
            let comentarios = obtenerComentarios();
            comentarios.unshift(nuevoComentario);
            localStorage.setItem('bolsillou_foro', JSON.stringify(comentarios));

            document.getElementById('foro-nombre').value = '';
            document.getElementById('foro-lugar').value = '';
            document.getElementById('foro-texto').value = '';
            cargarForo();
            alert("✅ ¡Tu tip ha sido publicado en el foro con éxito!");
        }

        // Reseñas de un restaurante (guardadas en el navegador o las del servidor)
        function obtenerResenas(r) {
            if (!r.resenasDinamicas) {
                const key = `resenas_${r.id_lugar || r.nombre.replace(/\s+/g, '_')}`;
                const guardadas = localStorage.getItem(key);
                r.resenasDinamicas = guardadas ? JSON.parse(guardadas) : (r.resenas || []);
            }
            return r.resenasDinamicas;
        }

        // Contenido del globito al tocar un punto del mapa
        function popupHtml(r, gi) {
            const todas = obtenerResenas(r);
            const precios = (r.platos || []).map(p => Number(p.precio)).filter(n => !isNaN(n));
            const desde = precios.length ? `<div style="font-size:11px;color:#a94f21;font-weight:700;margin-top:2px;">Desde $${Math.min(...precios).toLocaleString()}</div>` : '';
            const resHtml = todas.slice(0, 2).map(x => `
                <div style="margin-top:6px;padding:6px 8px;border-radius:12px;background:#faf5ec;border:1px solid #eadfca;">
                    <div style="display:flex;justify-content:space-between;gap:6px;font-size:11px;font-weight:700;color:#3b2f26;"><span>${esc(x.usuario)}</span><span>${"⭐".repeat(x.estrellas || 5)}</span></div>
                    <div style="font-size:11px;color:#6b5a4b;font-style:italic;margin-top:2px;">"${esc(x.comentario)}"</div>
                </div>`).join('') || '<div style="font-size:11px;color:#8a7766;margin-top:6px;">Aún no hay reseñas.</div>';
            const mas = todas.length > 2 ? `<div style="font-size:10px;color:#8a7766;margin-top:4px;">+ ${todas.length - 2} reseñas más</div>` : '';
            return `
                <div style="min-width:200px;">
                    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
                        <b style="font-size:14px;">${esc(r.nombre)}</b>
                        <span style="font-size:11px;font-weight:700;white-space:nowrap;">⭐ ${esc(r.calificacion)}</span>
                    </div>
                    <div style="font-size:11px;color:#8a7766;margin-top:2px;">📍 ${esc(r.direccion)}</div>
                    ${desde}
                    ${resHtml}${mas}
                    <button onclick="abrirDetalle(${gi})" style="width:100%;margin-top:8px;padding:8px;border-radius:999px;background:#c8642b;color:#fff;font-size:12px;font-weight:700;border:0;cursor:pointer;">Ver menú y reseñas</button>
                </div>`;
        }

        function abrirDetalle(index) {
            map.closePopup();
            const r = listaGlobal[index];
            const modal = document.getElementById('modal-restaurante');
            const body = document.getElementById('modal-body');

            const storageKey = `resenas_${r.id_lugar || r.nombre.replace(/\s+/g, '_')}`;
            if (!r.resenasDinamicas) {
                let guardadas = localStorage.getItem(storageKey);
                r.resenasDinamicas = guardadas ? JSON.parse(guardadas) : (r.resenas || [
                    { usuario: "Sofía G. (Derecho)", estrellas: 5, comentario: "¡Excelente porción y súper económico!" }
                ]);
            }

            let platosHtml = '';
            let platosAMostrar = r.platos || [];

            if (tipoFiltroActual === 'menor_15') {
                platosAMostrar = platosAMostrar.filter(p => Number(p.precio) <= 15000);
            } else if (tipoFiltroActual === 'mayor_15') {
                platosAMostrar = platosAMostrar.filter(p => Number(p.precio) > 15000);
            }

            if (platosAMostrar.length === 0) {
                platosHtml = `<p class="text-xs text-[var(--text-muted)] italic">No hay platos en este rango de precio para este local.</p>`;
            } else {
                platosAMostrar.forEach((p) => {
                    const pi = r.platos.indexOf(p);
                    platosHtml += `
                        <div class="bg-slate-50 dark:bg-slate-800 p-4 rounded-3xl flex justify-between items-center gap-3 border border-[var(--border-color)]">
                            <div class="flex-1 min-w-0">
                                <h4 class="font-bold text-sm text-[var(--text-main)]">${esc(p.nombre)}</h4>
                                <p class="text-[11px] text-[var(--text-muted)] mt-0.5">${esc(p.descripcion)}</p>
                            </div>
                            <div class="text-right shrink-0">
                                <span class="font-display text-sm font-bold text-emerald-700 dark:text-emerald-300 block">$${Number(p.precio).toLocaleString()}</span>
                                <button onclick="registrarGasto(${Number(p.precio)}, ${index}, ${pi})" class="mt-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] px-4 py-2 md:py-1.5 rounded-full font-bold">
                                    Pedir
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            let resenasHtml = '';
            r.resenasDinamicas.forEach((res) => {
                const estrellasItem = "⭐".repeat(res.estrellas || 5);
                resenasHtml += `
                    <div class="bg-slate-50 dark:bg-slate-800/60 p-4 rounded-3xl border border-[var(--border-color)]">
                        <div class="flex justify-between items-center gap-2 mb-1">
                            <span class="font-bold text-xs text-[var(--text-main)]">${esc(res.usuario)}</span>
                            <span class="text-xs whitespace-nowrap">${estrellasItem}</span>
                        </div>
                        <p class="text-[11px] text-[var(--text-muted)] italic break-words">"${esc(res.comentario)}"</p>
                    </div>
                `;
            });

            const lat = r.lat || 4.6017;
            const lng = r.lng || -74.0662;
            const linkGoogleMaps = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
            const linkWaze = `https://www.waze.com/ul?ll=${lat},${lng}&navigate=yes`;
            const claseLink = "flex-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-[var(--text-main)] text-xs py-3 md:py-2.5 px-3 rounded-full font-bold text-center transition";

            body.innerHTML = `
                <img src="${esc(r.foto || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80')}" class="w-full h-40 md:h-48 object-cover rounded-3xl mb-4">
                <div class="flex justify-between items-start mb-2 gap-2">
                    <h2 class="text-xl md:text-2xl font-bold">${esc(r.nombre)}</h2>
                    <span class="bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 text-xs px-3 py-1 rounded-full font-bold whitespace-nowrap">⭐ ${esc(r.calificacion)}</span>
                </div>
                <p class="text-xs text-emerald-700 dark:text-emerald-300 font-semibold mb-3">📍 ${esc(r.direccion)}</p>

                <div class="flex gap-2 mb-6">
                    <a href="${linkGoogleMaps}" target="_blank" rel="noopener" class="${claseLink}">Google Maps</a>
                    <a href="${linkWaze}" target="_blank" rel="noopener" class="${claseLink}">Waze</a>
                </div>

                <h3 class="text-xs font-bold uppercase tracking-wider text-[var(--text-muted)] mb-3">Platos y precios</h3>
                <div class="space-y-3 mb-6">${platosHtml}</div>

                <h3 class="text-xs font-bold uppercase tracking-wider text-[var(--text-muted)] mb-3">Reseñas de la comunidad</h3>
                <div class="space-y-3 mb-6">${resenasHtml}</div>

                <div class="bg-emerald-50 dark:bg-emerald-950/30 p-4 rounded-3xl border border-emerald-200 dark:border-emerald-800">
                    <h4 class="font-bold text-sm text-emerald-800 dark:text-emerald-200 mb-2">Deja tu propia reseña</h4>
                    <form onsubmit="agregarResenaDirecta(event, ${index})" class="space-y-3">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <input type="text" id="modal-user-name" required placeholder="Tu nombre y carrera" class="px-4 py-2 text-xs rounded-full border">
                            <select id="modal-user-stars" class="px-4 py-2 text-xs rounded-full border">
                                <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                                <option value="4">⭐⭐⭐⭐ (4/5)</option>
                                <option value="3">⭐⭐⭐ (3/5)</option>
                                <option value="2">⭐⭐ (2/5)</option>
                                <option value="1">⭐ (1/5)</option>
                            </select>
                        </div>
                        <textarea id="modal-user-comment" required rows="2" placeholder="¿Qué tal el plato y el precio?" class="w-full px-4 py-2 text-xs rounded-2xl border"></textarea>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-3 md:py-2.5 rounded-full font-bold">
                            Publicar reseña
                        </button>
                    </form>
                </div>
            `;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            map.setView([lat, lng], 17);
        }

        function agregarResenaDirecta(e, index) {
            e.preventDefault();
            const r = listaGlobal[index];
            const nombre = document.getElementById('modal-user-name').value;
            const estrellas = parseInt(document.getElementById('modal-user-stars').value);
            const comentario = document.getElementById('modal-user-comment').value;

            const nuevaResena = { usuario: nombre, estrellas, comentario };
            if (!r.resenasDinamicas) r.resenasDinamicas = [];
            r.resenasDinamicas.unshift(nuevaResena);

            const storageKey = `resenas_${r.id_lugar || r.nombre.replace(/\s+/g, '_')}`;
            localStorage.setItem(storageKey, JSON.stringify(r.resenasDinamicas));

            abrirDetalle(index);
            alert("✅ ¡Reseña agregada con éxito!");
        }

        function cerrarModal() {
            const modal = document.getElementById('modal-restaurante');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        let saldoActual = parseInt(localStorage.getItem('saldoActual')) || 500000;
        function pintarSaldo() {
            document.getElementById('lbl-saldo-actual').innerText = `$${saldoActual.toLocaleString()} COP`;
            localStorage.setItem('saldoActual', saldoActual);
        }

        function descontar(monto, nombre) {
            if (saldoActual - monto < 0) {
                alert("⚠️ ¡Cuidado! Este gasto supera tu presupuesto disponible.");
                return;
            }
            saldoActual -= monto;
            pintarSaldo();
            alert(`✅ ¡Gasto registrado!\n${nombre}\nValor: $${monto.toLocaleString()} COP`);
            cerrarModal();
        }

        function registrarGasto(monto, indexRest, indexPlato) {
            const r = listaGlobal[indexRest];
            descontar(monto, `${r.nombre} (${r.platos[indexPlato].nombre})`);
        }

        function ajustarPresupuesto() {
            const nuevo = parseInt(prompt("Ingresa tu presupuesto mensual de alimentación (COP):", saldoActual));
            if (nuevo >= 0) { saldoActual = nuevo; pintarSaldo(); }
        }

        window.onload = () => { pintarSaldo(); cargarRestaurantes(); };
    </script>
</body>
</html>
