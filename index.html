<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BolsilloU - Presupuesto y Comida Cerca al Campus</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --sidebar-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
            --primary: #10b981;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* Modo Oscuro */
        body.dark-mode {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --card-bg: #1e293b;
        }

        body.dark-mode .card,
        body.dark-mode .search-container,
        body.dark-mode .budget-box {
            background-color: var(--card-bg);
            color: var(--text-main);
            border-color: var(--border-color);
        }

        body.dark-mode input, body.dark-mode select {
            background-color: #0f172a;
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .sidebar-icon {
            transition: all 0.2s ease;
        }
        .sidebar-icon:hover {
            background-color: #e2e8f0;
        }
        body.dark-mode .sidebar-icon:hover {
            background-color: #334155;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- BARRA LATERAL -->
    <aside class="w-20 bg-[var(--sidebar-bg)] border-r border-[var(--border-color)] flex flex-col items-center py-6 justify-between z-10 shadow-sm">
        <div class="flex flex-col items-center gap-6">
            <div class="w-10 h-10 bg-emerald-600 text-white font-bold rounded-xl flex items-center justify-center text-lg shadow-md">U</div>
            <div class="sidebar-icon w-12 h-12 rounded-xl flex items-center justify-center cursor-pointer text-xl" title="Inicio">🍽️</div>
            <div class="sidebar-icon w-12 h-12 rounded-xl flex items-center justify-center cursor-pointer text-xl" title="Mapa de Restaurantes">🗺️</div>
            <div class="sidebar-icon w-12 h-12 rounded-xl flex items-center justify-center cursor-pointer text-xl" title="Favoritos">⭐</div>
        </div>
        <div class="sidebar-icon w-12 h-12 rounded-xl flex items-center justify-center cursor-pointer text-xl" id="btn-config" title="Cambiar modo oscuro/claro">⚙️</div>
    </aside>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="flex-1 flex flex-col h-full overflow-y-auto">
        
        <!-- HEADER SUPERIOR -->
        <header class="bg-[var(--sidebar-bg)] border-b border-[var(--border-color)] px-8 py-4 flex justify-between items-center shadow-xs">
            <div>
                <h1 class="text-xl font-bold">BolsilloU - Alimentación Inteligente</h1>
                <p class="text-xs text-[var(--text-muted)]">Gestiona tu presupuesto y descubre dónde comer cerca al campus</p>
            </div>
            
            <!-- Resumen de Presupuesto Rápido -->
            <div class="flex items-center gap-4 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 px-4 py-2 rounded-xl">
                <div>
                    <p class="text-[10px] text-emerald-700 dark:text-emerald-400 font-semibold uppercase">Presupuesto Disponible</p>
                    <p class="text-lg font-black text-emerald-800 dark:text-emerald-300" id="lbl-saldo-actual">$500.000 COP</p>
                </div>
                <button onclick="abrirConfigPresupuesto()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">Ajustar</button>
            </div>
        </header>

        <!-- CUERPO DE LA APP -->
        <div class="p-8 max-w-7xl mx-auto w-full flex flex-col gap-6">

            <!-- PANEL DE FILTROS Y BÚSQUEDA -->
            <div class="budget-box bg-[var(--sidebar-bg)] border border-[var(--border-color)] p-5 rounded-2xl shadow-sm flex flex-wrap gap-4 items-center justify-between">
                <div class="flex-1 min-w-[280px]">
                    <label class="block text-xs font-semibold text-[var(--text-muted)] mb-1">Buscar qué comer (Ej. Almuerzo, Hamburguesa, Menú):</label>
                    <input type="text" id="input-busqueda" placeholder="Ej. Almuerzo ejecutivo, Vegetariano..." class="w-full px-4 py-2 text-sm rounded-xl border border-[var(--border-color)] focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-[var(--text-muted)] mb-1">Filtro rápido:</label>
                    <select id="filtro-categoria" class="px-4 py-2 text-sm rounded-xl border border-[var(--border-color)] focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="almuerzo">Almuerzos y Menús</option>
                        <option value="economico">Económicos</option>
                        <option value="vegetariano">Vegetariano / Saludable</option>
                    </select>
                </div>

                <div class="self-end">
                    <button onclick="buscarRestaurantesAPI()" class="bg-slate-900 hover:bg-slate-800 dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                        Buscar en Google Maps 🔍
                    </button>
                </div>
            </div>

            <!-- SECCIÓN DE RECOMENDACIONES -->
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold">Restaurantes recomendados cerca a la Universidad</h2>
                    <span class="text-xs text-[var(--text-muted)]" id="contador-resultados">Cargando opciones...</span>
                </div>

                <!-- CONTENEDOR DE TARJETAS -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="contenedor-restaurantes">
                    <!-- Se llenará dinámicamente con la API -->
                </div>
            </div>

        </div>
    </main>

    <!-- SCRIPT DE FUNCIONALIDAD Y CONEXIÓN CON FASTAPI -->
    <script>
        // URL de tu backend en Render (Cámbiala por http://localhost:8000 si pruebas localmente)
        const API_URL = "https://observatorio-obras-bogota.onrender.com";

        // Lógica de Modo Oscuro
        const btnConfig = document.getElementById('btn-config');
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
        }
        btnConfig.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode') ? 'enabled' : 'disabled');
        });

        // Función para consumir la API de FastAPI (Google Places)
        async function buscarRestaurantesAPI() {
            const queryInput = document.getElementById('input-busqueda').value || "almuerzo";
            const contenedor = document.getElementById('contenedor-restaurantes');
            
            contenedor.innerHTML = `<div class="col-span-full text-center py-12 text-[var(--text-muted)]">⏳ Buscando los mejores lugares cerca a la universidad...</div>`;

            try {
                const response = await fetch(`${API_URL}/api/restaurantes?query=${encodeURIComponent(queryInput)}`);
                const data = await response.json();

                renderizarRestaurantes(data);
            } catch (error) {
                console.error("Error al conectar con la API:", error);
                contenedor.innerHTML = `<div class="col-span-full text-center py-12 text-red-500 font-semibold">⚠️ Error de conexión con el servidor de la API. Intenta de nuevo en unos segundos.</div>`;
            }
        }

        function renderizarRestaurantes(lista) {
            const contenedor = document.getElementById('contenedor-restaurantes');
            contenedor.innerHTML = '';

            if(!lista || lista.length === 0) {
                contenedor.innerHTML = `<div class="col-span-full text-center py-12 text-[var(--text-muted)]">No se encontraron restaurantes cercanos con ese criterio.</div>`;
                document.getElementById('contador-resultados').innerText = `0 opciones encontradas`;
                return;
            }

            lista.forEach(r => {
                contenedor.innerHTML += `
                    <div class="card bg-[var(--sidebar-bg)] border border-[var(--border-color)] rounded-2xl p-5 shadow-xs flex flex-col justify-between transition hover:shadow-md">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-base line-clamp-1">${r.nombre}</h3>
                                <span class="bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 text-xs px-2 py-0.5 rounded-md font-semibold whitespace-nowrap">⭐ ${r.calificacion} (${r.total_reviews})</span>
                            </div>
                            <p class="text-xs text-emerald-600 dark:text-emerald-400 font-medium mb-2">📍 ${r.direccion}</p>
                            <p class="text-xs text-[var(--text-muted)] mb-4">Estado: ${r.abierto ? '🟢 Abierto' : '🔴 Cerrado'}</p>
                        </div>
                        <div class="pt-4 border-t border-[var(--border-color)] flex items-center justify-between">
                            <div>
                                <span class="text-[10px] text-[var(--text-muted)] block">Costo estimado:</span>
                                <span class="font-bold text-sm">$${r.precio_aprox.toLocaleString()} COP</span>
                            </div>
                            <button onclick="registrarGasto(${r.precio_aprox}, '${r.nombre.replace(/'/g, "")}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-4 py-2 rounded-xl font-medium transition shadow-sm">
                                Registrar Gasto 💸
                            </button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('contador-resultados').innerText = `Mostrando ${lista.length} opciones reales`;
        }

        // Control de Presupuesto
        let saldoActual = 500000;

        function registrarGasto(monto, nombreRestaurante) {
            if (saldoActual - monto < 0) {
                alert("⚠️ ¡Cuidado! Este gasto supera tu presupuesto disponible para el mes.");
                return;
            }
            saldoActual -= monto;
            document.getElementById('lbl-saldo-actual').innerText = `$${saldoActual.toLocaleString()} COP`;
            alert(`✅ Gasto de $${monto.toLocaleString()} registrado en ${nombreRestaurante}. ¡Buen provecho!`);
        }

        function abrirConfigPresupuesto() {
            let nuevoPresupuesto = prompt("Ingresa tu presupuesto mensual de alimentación (COP):", saldoActual);
            if (nuevoPresupuesto && !isNaN(nuevoPresupuesto)) {
                saldoActual = parseInt(nuevoPresupuesto);
                document.getElementById('lbl-saldo-actual').innerText = `$${saldoActual.toLocaleString()} COP`;
            }
        }

        // Carga inicial automática al abrir la página
        window.onload = () => {
            buscarRestaurantesAPI();
        };
    </script>
</body>
</html>
